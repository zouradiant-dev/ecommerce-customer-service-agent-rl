[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-customer-service-agent-rl"
version = "0.2.0"
description = "Verifiable ecommerce customer-service agent environment with a self-built SQLite database"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["langgraph>=1.0,<2"]
mcp = ["mcp==1.26.0"]

[project.scripts]
ecommerce-cs = "ecommerce_customer_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ecommerce_customer_service.serving" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
