<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>售后服务中心</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172b46;font:15px/1.65 system-ui,sans-serif}main{max-width:1120px;margin:30px auto;padding:0 22px}h1,h2,p{margin-top:0}h1{font-size:30px;margin-bottom:4px}h2{font-size:19px}small,.muted{color:#617088}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.account{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px}.panel{background:white;border:1px solid #dce4ef;border-radius:15px;padding:23px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}button,select,textarea{font:inherit;border-radius:8px;border:1px solid #c6d2e1;padding:10px}button{background:#1769bd;color:white;cursor:pointer}button.secondary{background:white;color:#1769bd}button:disabled,textarea:disabled{opacity:.55;cursor:default}textarea{width:100%;min-width:0;resize:vertical}.notice{background:#edf4ff;color:#335777;padding:12px 16px;border-radius:10px;margin:18px 0}.error{color:#a62c2c;background:#fff1f0;padding:12px;border-radius:8px;white-space:pre-wrap}.error:empty{display:none}.order,.operation{border:1px solid #dce5f0;border-radius:10px;padding:15px;margin:12px 0;overflow-wrap:anywhere}.order-title{display:flex;justify-content:space-between;gap:10px}.tag{color:#4f637b;font-size:13px}.money{font-weight:600;margin:7px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 15px;border-radius:10px;margin:10px 0;background:#f1f5fa}.message.user{background:#eaf2ff;margin-left:35px}.message.assistant{margin-right:20px}.empty{padding:28px 10px;color:#718097;text-align:center}#history{height:380px;overflow:auto;margin:15px 0}.compose{display:flex;gap:10px;align-items:flex-end}.compose textarea{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{font-size:13px;color:#596b82}.divider{border:0;border-top:1px solid #edf0f5;margin:24px 0}#model-note{font-size:14px}.foot{margin-top:18px;font-size:13px;color:#7a8799}
@media(max-width:760px){main{padding:0 15px;margin:20px auto}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:minmax(0,1fr)}.panel{padding:18px}#history{height:300px}.compose{flex-direction:column;align-items:stretch}}
</style></head><body><main>
<header class="top"><div><h1>售后服务中心</h1><small>查询订单，处理取消与售后申请</small></div><div class="account" id="account-wrap"><label for="account">演示账号</label><select id="account"><option value="alice">小林</option><option value="bob">小陈</option></select><span id="connection" class="badge">正在连接…</span></div></header>
<div id="error" class="error" role="alert"></div>
<div class="notice">当前使用演示订单。确认取消会更新演示订单状态，不涉及真实资金。</div>
<div class="grid"><section class="panel"><div class="panel-head"><h2>我的订单</h2><button id="orders" class="secondary">刷新订单</button></div><div id="order-list"></div><hr class="divider"><h2>处理进度</h2><div id="operations"></div></section>
<section class="panel"><div class="panel-head"><h2>在线客服</h2><button id="new" class="secondary">重新开始</button></div><p id="model-note" class="muted">正在检查客服状态…</p><div id="history" aria-live="polite"></div><div class="compose"><textarea id="text" rows="3" placeholder="例如：帮我取消耳机订单" disabled></textarea><button id="send" disabled>发送</button></div><div class="actions"><button id="retry" class="secondary" hidden>重新发送</button></div></section></div>
<div class="foot">取消前会显示具体订单和预计退款金额，请核对后确认。</div>
</main><script>
const $=id=>document.getElementById(id);let currentConversation=null,pendingRequest=null,modelConfigured=false,account='alice',busy=false;
const labels={active:'会话已连接',handed_off:'等待人工处理',pending_confirmation:'请确认取消申请',executing:'正在提交',submitted:'处理中',unknown:'结果待核查',succeeded:'订单已取消',failed:'未能完成',expired:'申请已过期',superseded:'申请已作废',paid:'已付款',pending:'待处理',shipped:'已发货',cancelled:'已取消'};
const errors={authentication_required:'请重新连接演示账号。',invalid_token:'登录已失效，请重新连接。',order_not_cancellable:'这笔订单目前不能取消，请联系售后处理。',order_changed_reconfirm_required:'订单状态已变化，请刷新订单后重新申请。',confirmation_invalidated:'这次申请已作废，请重新选择订单。',confirmation_expired:'确认已过期，请重新申请。',conversation_busy:'正在处理上一条请求，请稍候。',request_in_progress:'消息正在处理，请稍候。',conversation_handed_off:'当前会话已转人工，可以重新开始一次咨询。',order_has_unresolved_operation:'这笔订单还有一项待确认结果的操作，请先查询处理进度。',model_or_turn_failed:'客服暂时无法回复，请稍后重新咨询。',service_or_backend_unavailable:'服务暂时不可用，请稍后再试。',demo_login_not_available:'当前服务未开放演示登录。'};
errors.model_output_invalid='这次回复没有完成操作，请重新咨询或通过订单卡片操作。';
function readable(code){return errors[code]||'暂时无法完成，请刷新后重试。'}
function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(readable(value.error));return value}
function syncButtons(){document.querySelectorAll('button,select').forEach(node=>node.disabled=busy);$('send').disabled=busy||!modelConfigured||!currentConversation;$('text').disabled=!modelConfigured||!currentConversation;$('retry').hidden=!pendingRequest;}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';syncButtons();try{await fn()}catch(error){$('error').textContent=error.message}finally{busy=false;syncButtons()}}
function path(){if(!currentConversation)throw Error('会话尚未连接，请刷新页面。');return '/api/conversations/'+encodeURIComponent(currentConversation)}
async function refresh(){const value=await api(path());$('connection').textContent=labels[value.status]||'已连接';$('history').replaceChildren();for(const message of value.messages){if(message.role==='tool'||message.tool_calls)continue;const text=message.content||'';if(text.includes('当前是手动业务验证模式')||text.includes('智能客服暂未连接'))continue;const node=element('div',text);node.className='message '+message.role;$('history').append(node)}if(!$('history').children.length)$('history').append(element('div',modelConfigured?'您好，请问需要查询或处理哪笔订单？':'您可以先在左侧查看订单并申请取消。'));$('history').scrollTop=$('history').scrollHeight;
 $('operations').replaceChildren();for(const operation of value.operations.slice().reverse()){const card=element('div','');card.className='operation';card.dataset.status=operation.status;card.append(element('strong',labels[operation.status]||'处理中'));card.append(element('div','订单：'+operation.order_id));card.append(element('div','预计退款：¥'+(operation.amount_cents/100).toFixed(2)));if(operation.receipt){const refund=operation.receipt.refund_status;card.dataset.refundStatus=refund||'none';card.append(element('div',refund==='pending'?'退款处理中，尚未确认到账。':refund==='succeeded'?'后台报告退款成功。':refund==='failed'?'退款处理失败，请联系人工。':'无需退款。'))}if(operation.error)card.append(element('div',readable(operation.error)));const buttons=element('div','');buttons.className='actions';if(operation.status==='pending_confirmation'){const confirm=element('button','确认取消');confirm.onclick=()=>action(async()=>{if(!window.confirm('确认取消订单 '+operation.order_id+'？预计退款 ¥'+(operation.amount_cents/100).toFixed(2)+'。'))return;await api('/api/operations/'+operation.id+'/confirm',{});await refresh();await loadOrders()});buttons.append(confirm)}if(['unknown','submitted','executing'].includes(operation.status)){const check=element('button','查询处理结果');check.className='secondary';check.onclick=()=>action(async()=>{await api('/api/operations/'+operation.id);await refresh();await loadOrders()});buttons.append(check)}card.append(buttons);$('operations').append(card)}if(!$('operations').children.length){const empty=element('div','暂无待处理申请');empty.className='empty';$('operations').append(empty)}}
async function loadOrders(){const value=await api('/api/orders');$('order-list').replaceChildren();$('order-list').dataset.orders=JSON.stringify(value.orders);for(const order of value.orders){const card=element('div','');card.className='order';const title=element('div','');title.className='order-title';title.append(element('strong',order.product||'商品'));const status=element('span',labels[order.status]||order.status);status.className='tag';title.append(status);card.append(title);card.append(element('small','订单 '+order.id));const amount=element('div','已付 ¥'+(order.paid_cents/100).toFixed(2));amount.className='money';card.append(amount);if(['pending','paid'].includes(order.status)){const preview=element('button','申请取消');preview.className='secondary';preview.onclick=()=>action(async()=>{await api(path()+'/preview-cancel',{order_id:order.id});await refresh()});card.append(preview)}else card.append(element('small',order.status==='shipped'?'已发货，暂不支持直接取消。':'订单已取消。'));$('order-list').append(card)}}
async function login(){const login=await api('/api/demo-login',{account});const key='customer-service-conversation-'+account;currentConversation=localStorage.getItem(key)||login.conversation_id;pendingRequest=null;if(currentConversation){try{await refresh()}catch{currentConversation=null}}if(!currentConversation){const result=await api('/api/conversations',{});currentConversation=result.conversation_id;await refresh()}localStorage.setItem(key,currentConversation);await loadOrders()}
async function send(retry){if(!retry){const text=$('text').value.trim();if(!text)return;pendingRequest={conversation:currentConversation,request_id:crypto.randomUUID(),text}}const result=await api('/api/conversations/'+encodeURIComponent(pendingRequest.conversation)+'/messages',{request_id:pendingRequest.request_id,text:pendingRequest.text});if(result.error){pendingRequest=null;$('error').textContent=readable(result.error)}else{pendingRequest=null;$('text').value=''}await refresh();await loadOrders()}
$('account').onchange=()=>action(async()=>{account=$('account').value;localStorage.setItem('customer-service-account',account);await login()});$('orders').onclick=()=>action(loadOrders);$('new').onclick=()=>action(async()=>{const result=await api('/api/conversations',{});currentConversation=result.conversation_id;pendingRequest=null;localStorage.setItem('customer-service-conversation-'+account,currentConversation);await refresh()});$('send').onclick=()=>action(()=>send(false));$('retry').onclick=()=>action(()=>send(true));
action(async()=>{const config=await api('/api/ui-config');modelConfigured=config.model_configured;$('model-note').textContent=modelConfigured?'描述您的需求，客服会查询订单。涉及取消的操作需要您确认。':'智能客服尚未连接。当前可以查看演示订单，并通过订单卡片申请取消。';if(!config.demo_accounts.length){$('account-wrap').hidden=true;throw Error('当前服务需要企业登录，尚未配置登录入口。')}account=localStorage.getItem('customer-service-account')||'alice';if(!config.demo_accounts.includes(account))account=config.demo_accounts[0];$('account').value=account;await login()});
</script></body></html>
